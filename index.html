}

  else x.drawImage(im,cx-w/2,cy-h/2,w,h);
}

function spawnPattern(){
  const X=W+130,sec=t/60;
  if(stageNo===2){spawnStage2Pattern(X);return}
  // V8.4.6 ROUND 1: ramp begins around 200 points; Churu can appear as a rare recovery.
  const midPush=score>=200;
  if(p.hp<3&&!objs.some(z=>z.k==='churu')&&Math.random()<(p.hp===1?.045:.018)){objs.push({k:'churu',x:X+360,y:G-165,good:true});}
  const canRock=sec>2&&rockCooldown<=0&&!objs.some(z=>z.rock||(z.bad&&z.x>W-70));
  if(canRock){objs.push({k:'rock',x:W-105,y:-75,rock:true,bad:true,w:96,h:72,phase:'drop',targetY:510,vy:7.2});rockCooldown=Math.max(midPush?72:85,185-score*.018)+Math.random()*(midPush?55:75);patternLock=150;spawn=(midPush?122:150)+Math.random()*(midPush?28:35);return;}
  const y=G-170-Math.random()*65;
  // After ~950 points, favor obstacle patterns instead of long bean-only stretches.
  const r=Math.random();
  const pattern=midPush?(r<.12?0:r<.45?1:r<.78?2:r<.90?3:4):Math.floor(r*5);
  if(pattern===0){for(let i=0;i<(midPush?3:4);i++)objs.push({k:'bean',x:X+i*92,y:y-(i%2?28:0),good:true});}
  else if(pattern===1){objs.push({k:'bean',x:X,y,good:true});if(!midPush)objs.push({k:'bean',x:X+100,y:y-18,good:true});const k=['fish','fish','fish','box','box','box','tuna'][Math.floor(Math.random()*7)],d=k==='box'?[118,118]:k==='fish'?[132,82]:[118,82];objs.push({k,x:X+(midPush?235:300),y:G-d[1]/2,bad:true,w:d[0],h:d[1]});}
  else if(pattern===2){const k=['fish','fish','fish','box','box','box','tuna'][Math.floor(Math.random()*7)],d=k==='box'?[118,118]:k==='fish'?[132,82]:[118,82];objs.push({k,x:X+100,y:G-d[1]/2,bad:true,w:d[0],h:d[1]});objs.push({k:'bean',x:X+(midPush?270:315),y:G-190,good:true});}
  else if(pattern===3){for(let i=0;i<(midPush?3:5);i++)objs.push({k:'bean',x:X+i*82,y:G-145-(i===1?55:0),good:true});}
  else{const k=['fish','fish','fish','box','box','box','tuna'][Math.floor(Math.random()*7)],d=k==='box'?[118,118]:k==='fish'?[132,82]:[118,82];objs.push({k,x:X+150,y:G-d[1]/2,bad:true,w:d[0],h:d[1]});objs.push({k:'bean',x:X+330,y:G-185,good:true});}
  const scoreFactor=Math.max(.34,1-score/2100*.55),timeFactor=Math.max(.82,1-sec*.004),midFactor=midPush?.82:1;
  spawn=(150+Math.random()*50)*scoreFactor*timeFactor*midFactor;
}
function stage2BeanBurst(X,count=6,spacing=64){
  const shape=Math.floor(Math.random()*3);
  for(let i=0;i<count;i++){
    let y=G-145;
    if(shape===0)y-=Math.sin(i/(Math.max(1,count-1))*Math.PI)*88;
    else if(shape===1)y-=i%2?58:8;
    else y-=Math.abs((count-1)/2-i)*15;
    objs.push({k:'bean',x:X+i*spacing,y,good:true});
  }
}
function spawnStage2Pattern(X){
  // V8.4.10 NIGHT MARKET: hard, rhythmic rushes + a guaranteed octopus showcase.
  if(stage2Mode==='rest'){spawn=999;return;}

  const bads=objs.filter(z=>z.bad&&!z.octopus);
  const octopusActive=objs.some(z=>z.octopus);

  // The octopus owns the stage while active. No other dangerous obstacle may spawn.
  if(octopusActive){spawn=18;return;}

  // When its timer is due, stop creating new hazards, let the lane clear,
  // then force the octopus to appear. This prevents it from being starved by dense patterns.
  if(stage2Elapsed>=stage2NextOctopus)stage2OctopusPrep=true;
  if(stage2OctopusPrep){
    if(bads.length){spawn=12;return;}
    const ox=W+230;
    objs.push({k:'octopus',x:ox,y:G-66,bad:true,octopus:true,w:118,h:92,octoT:0,baseY:G-66});
    // Light coffee-bean cues only; no box/fish/tuna/rock/paw during the octopus sequence.
    objs.push({k:'bean',x:ox+135,y:G-180,good:true});
    if(Math.random()<.65)objs.push({k:'bean',x:ox+310,y:G-225,good:true});
    stage2NextOctopus=stage2Elapsed+720+Math.floor(Math.random()*360); // 12–18 sec later
    stage2OctopusPrep=false;
    stage2HazardStreak++;
    spawn=28;
    return;
  }

  const nearestBad=bads.reduce((m,z)=>Math.max(m,z.x),-9999);
  const rockDropping=bads.some(z=>z.rock&&z.phase==='drop');
  const unsafeToAdd=rockDropping||nearestBad>W+70;
  if(unsafeToAdd){spawn=18+Math.random()*10;return;}

  const canRock=rockCooldown<=0&&!objs.some(z=>z.rock);
  const roll=Math.random();
  if(canRock&&roll>.78){
    if(Math.random()<.70)objs.push({k:'bean',x:X,y:G-205,good:true});
    objs.push({k:'rock',x:W-105,y:-75,rock:true,bad:true,w:96,h:72,phase:'drop',targetY:510,vy:7.8});
    rockCooldown=105+Math.random()*55;
    stage2HazardStreak++;
    spawn=52+Math.random()*14;
  }else if(roll<.045){
    stage2BeanBurst(X,2,86);
    spawn=42+Math.random()*12;
    return;
  }else{
    const k=['tuna','fish','fish','box','box'][Math.floor(Math.random()*5)],
          d=k==='box'?[118,118]:k==='fish'?[132,82]:[118,82];
    const hx=X+205;
    if(Math.random()<.70)objs.push({k:'bean',x:X,y:G-175-(Math.random()<.35?42:0),good:true});
    // Normal hazards remain ground-sliding objects. Only z.octopus uses bounce motion.
    objs.push({k,x:hx,y:G-d[1]/2,bad:true,w:d[0],h:d[1]});
    if(Math.random()<.38)objs.push({k:'bean',x:hx+160,y:G-190-(Math.random()<.25?38:0),good:true});
    stage2HazardStreak++;
    spawn=48+Math.random()*16;
  }

  if(stage2HazardStreak>=5&&p.hp<3&&!objs.some(z=>z.k==='churu')&&Math.random()<.34){
    objs.push({k:'churu',x:X+390,y:G-170,good:true});
    stage2HazardStreak=0;
  }
}
function spawnGoldenPaw(){if(objs.some(z=>z.golden))return;const px=270+Math.random()*285;objs.push({k:'paw',x:px,y:105,good:true,golden:true,falling:true,vy:1.65,stopY:245,wait:0,expired:false})}
function puff(){const cx=p.x+74,cy=p.y+p.h-18;for(let i=0;i<10;i++)fx.push({x:cx+(Math.random()-.5)*44,y:cy+(Math.random()-.5)*12,vx:(Math.random()-.5)*2.6,vy:-.8-Math.random()*1.8,r:7+Math.random()*9,a:.82})}
function jump(){if(!['play','boss'].includes(state)||paused)return;if(p.duck)return;if(p.on){p.vy=-15.2;p.on=false;p.j=1}else if(p.j===1){p.vy=-12.5;p.j=2;puff()}}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function rectGap(a,b){const dx=Math.max(b.x-(a.x+a.w),a.x-(b.x+b.w),0),dy=Math.max(b.y-(a.y+a.h),a.y-(b.y+b.h),0);return Math.hypot(dx,dy)}
function breakCombo(){if(combo<=0)return;comboBreakFx={value:combo,age:0,dur:30};combo=0;comboBanner=0;comboAnim=null}
function triggerComboAnim(v){comboAnim={value:v,age:0,dur:16}}
function hurt(){if(p.inv)return;p.hp--;p.inv=100;breakCombo();try{tiredSfx.currentTime=0;tiredSfx.play()}catch(e){}if(p.hp<=0)finishGame()}
function finishGame(){state='over';bgm.playbackRate=1;bossBgm.pause();if(!bgm.paused){bgm.play().catch(()=>{})}const sc=Math.floor(score);qualifies=rankings.length<10||sc>(rankings[rankings.length-1]?.score||-1);if(qualifies){state='initials';initials=['A','A','A'];initialPos=0}}
function saveInitials(){rankings.push({name:initials.join(''),score:Math.floor(score)});rankings.sort((a,b)=>b.score-a.score);rankings=rankings.slice(0,10);localStorage.setItem('nkv8rank',JSON.stringify(rankings));best=rankings[0]?.score||0;state='over'}
function playRockWhoosh(){try{rockWhooshSfx.currentTime=0;rockWhooshSfx.play()}catch(e){}}
function playerPhysics(){
  p.duck=keys.down&&p.on;
  if(!p.duck){if(keys.left){p.x-=4.4;p.dir=-1}if(keys.right){p.x+=4.4;p.dir=1}}
  // Full-map movement in normal play; boss fights restore the original left-side arena boundary.
  const maxX=state==='boss'?610:W-p.w-35;
  p.x=Math.max(35,Math.min(maxX,p.x));p.vy+=.65;p.y+=p.vy;if(p.y>=G-p.h){p.y=G-p.h;p.vy=0;p.on=true;p.j=0}if(p.inv)p.inv--;p.a++;
}
function updateFx(){for(const f of fx){f.x+=f.vx;f.y+=f.vy;f.vy-=.015;f.r+=.12;f.a-=.026}fx=fx.filter(f=>f.a>0)}
function playerHB(){return p.duck?{x:p.x+18,y:G-50,w:118,h:42}:{x:p.x+38,y:p.y+34,w:72,h:125}}

function update(){
  if(paused)return;
  if(state==='boss'){updateBoss();return}
  if(state==='clear'){updateClear();return}
  if(state!=='play')return;
  t++;if(patternLock>0)patternLock--;rockCooldown--;playerPhysics();
  if(stageNo===2){
    stage2Elapsed++;stage2PhaseT--;
    if(stage2PhaseT<=0){
      if(stage2Mode==='rush'){
        stage2Mode='rest';stage2PhaseT=32+Math.floor(Math.random()*13); // ~0.53–0.73 sec: a readable breath between hard rushes
        spawn=999;
      }else{
        stage2Mode='rush';stage2RushNo++;stage2PhaseT=270+Math.floor(Math.random()*90);
        spawn=4+Math.random()*5;
      }
    }
  }
  // V8.4.7 BALANCE RESET: keep V8's snappy base speed, but stop the runaway acceleration.
  // ROUND 1: +4% per 100 score, time acceleration ~1.1%/sec capped at +45%.
  // ROUND 2: always begins at a clearly faster Night Market minimum speed, then ramps gently.
  const sec=t/60,fastStage=Math.floor(score/100),scoreRamp=1+Math.min(.24,.04*fastStage),timeRamp=1+Math.min(.45,sec*.011);
  if(stageNo===1){
    speed=baseSpeed*scoreRamp*timeRamp;
  }else{
    const NIGHT_MIN_SPEED=4.15;
    const nightRamp=1+Math.min(.30,(stage2Elapsed/60)*.005);
    speed=Math.max(stage1FinalSpeed,NIGHT_MIN_SPEED)*nightRamp;
  }
  bgm.playbackRate=Math.min(1.31,1+(speed/baseSpeed-1)*.20);
  if(fastStage>lastSpeedStage){lastSpeedStage=fastStage;speedBanner=72}
  if(score>=400&&bossLevel===0){beginBoss(1);return}
  if(score>=1000&&bossLevel===1){beginBoss(2);return}
  if(!(stageNo===2&&stage2Mode==='rest')&&--spawn<=0)spawnPattern();
  const hasGolden=objs.some(z=>z.golden&&!z.expired),octoLock=stageNo===2&&(stage2OctopusPrep||objs.some(z=>z.octopus));if(!hasGolden&&!(stageNo===2&&stage2Mode==='rest')&&!octoLock){goldenCooldown--;if(goldenCooldown<=0)spawnGoldenPaw()}
  if(speedBanner>0)speedBanner--;if(comboBanner>0)comboBanner--;if(fever>0)fever--;if(feverBurst>0)feverBurst--;if(comboAnim&&++comboAnim.age>=comboAnim.dur)comboAnim=null;if(comboBreakFx&&++comboBreakFx.age>=comboBreakFx.dur)comboBreakFx=null;
  for(const z of objs){if(z.golden){if(z.falling){z.y+=z.vy;if(z.y>=z.stopY){z.y=z.stopY;z.falling=false;z.wait=180}}else if(--z.wait<=0){z.expired=true;goldenCooldown=500+Math.random()*300}}else if(z.rock){if(z.phase==='drop'){z.y+=z.vy;if(z.y>=z.targetY){z.y=z.targetY;z.phase='fly';playRockWhoosh()}}else z.x-=speed+2.4}else if(z.octopus){
      z.octoT++;z.x-=speed+.75;
      // V8.5.0 octopus: five readable bounces, LOW → HIGH → LOW → HIGH → LOW.
      // Speed and jump heights intentionally match the approved V8.4.10 feel.
      const a=z.octoT;
      const seq=[{d:42,h:54},{d:58,h:158},{d:42,h:54},{d:58,h:158},{d:42,h:54}];
      let rem=a,local=0,dur=42,height=54,done=false;
      for(let bi=0;bi<seq.length;bi++){
        const b=seq[bi];
        if(rem<b.d){local=rem;dur=b.d;height=b.h;break}
        rem-=b.d;
        if(bi===seq.length-1)done=true;
      }
      if(done){z.expired=true;continue}
      z.y=z.baseY-Math.sin(Math.PI*local/dur)*height;
    }else z.x-=speed}
  for(const z of objs){if(z.k==='bean'&&!z.missed&&z.x<-25){z.missed=true;if(combo>0)breakCombo()}}
  objs=objs.filter(z=>!z.expired&&z.x>-180&&z.y<H+100);
  const hb=playerHB();
  for(let i=objs.length-1;i>=0;i--){const z=objs[i];if(z.bad){const q=z.rock?{x:z.x-z.w*.42,y:z.y-z.h*.38,w:z.w*.84,h:z.h*.76}:z.octopus?{x:z.x-z.w*.36,y:z.y-z.h*.34,w:z.w*.72,h:z.h*.68}:{x:z.x-z.w*.39,y:z.y-z.h*.38,w:z.w*.78,h:z.h*.72};if((!z.rock||z.phase==='fly')&&hit(hb,q)){z.hitPlayer=true;hurt()}}else{const dx=p.x+75-z.x,dy=(p.duck?p.y+135:p.y+80)-z.y;if(Math.hypot(dx,dy)<82){if(z.golden&&p.j!==2)continue;if(z.k==='bean'){beans++;combo++;maxCombo=Math.max(maxCombo,combo);triggerComboAnim(combo);const pts=(10+combo)*(fever>0?2:1);score+=pts;if(combo%5===0)comboBanner=70;if(combo===30){fever=300;feverBurst=78}}else if(z.k==='paw'){score+=50;goldenCooldown=500+Math.random()*300}else if(z.k==='churu'){if(p.hp<3)p.hp++}objs.splice(i,1)}}}
  updateFx();
}

function beginBoss(level){
  if(level===1)stage1FinalSpeed=speed;
  state='boss';objs=[];cookies=[];bossPickups=[];combo=0;fever=0;comboAnim=null;comboBreakFx=null;feverBurst=0;keys.down=false;
  const duration=level===1?2400:3600;
  boss={level,phase:'warning',phaseT:120,timer:duration,duration,attackT:level===1?46:38,nextType:Math.random()<.5?'high':'low',throws:0,bearX:1500,bag:1,rush:false,pairT:0,pairType:null,churuT:420+Math.random()*360};
  bgm.pause();bossBgm.currentTime=0;bossBgm.playbackRate=level===1?1:1.08;bossBgm.play().catch(()=>{});

function spawnBossCookie(type,boost=0){

      const type=boss.nextType;spawnBossCookie(type,boss.level===2?1.2+(rush?1.5:0):0);
      boss.nextType=Math.random()<.5?'high':'low';
      const progress=1-boss.timer/boss.duration;
      if(boss.level===1){boss.attackT=Math.round(50-progress*10+Math.random()*8)}
      else{
        // Lv.2: tighter from the start; GOM RUSH uses fair high↔low pairs.
        boss.attackT=Math.round((rush?36:43)-progress*(rush?4:6)+Math.random()*5);

    return;
  }
  if(boss.phase==='exit'){

    if(boss.phaseT<=0){state='clear';boss.phase='clear';boss.clearElapsed=0;boss.phaseT=clearTotal;bossBgm.pause();}

    return;
  }

  }
}

window.addEventListener('keydown',e=>{
  if(e.code==='KeyR'&&state==='clear'&&boss&&boss.level===2){beginStaffReset();return}
  if((e.code==='Space'||e.code==='Enter')&&state==='title'){start();return}
  if(e.code==='Space'&&state==='over'){start();return}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();startTitleMusic();
  if(state==='initials'){if(e.code==='ArrowLeft')initialPos=Math.max(0,initialPos-1);else if(e.code==='ArrowRight')initialPos=Math.min(2,initialPos+1);else if(e.code==='Enter')saveInitials();else if(/^Key[A-Z]$/.test(e.code)){initials[initialPos]=e.code.slice(3);if(initialPos<2)initialPos++}return}
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=true;
  if((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')&&!e.repeat&&!keys.down)jump();if(e.code==='KeyP'&&['play','boss'].includes(state))paused=!paused;if(e.code==='KeyM'){bgm.muted=!bgm.muted;bossBgm.muted=bgm.muted}
  if(e.code==='Enter'&&(state==='title'||state==='over'))start();
});
window.addEventListener('keyup',e=>{if(e.code==='KeyR')cancelStaffReset();if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=false});
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;if(state==='title'){start();return}if(state==='initials'){if(mx>=535&&mx<=831&&my>=525&&my<=587)saveInitials();return}if(state==='over'){if(mx>=470&&mx<=705&&my>=590&&my<=652)start();else if(mx>=730&&mx<=895&&my>=590&&my<=652){state='title';reset()}return}if(['play','boss'].includes(state))jump()});

reset();loop();
</script>
</body>
</html>
